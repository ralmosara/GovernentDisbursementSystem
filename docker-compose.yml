# MySQL-compatible database for local development.
# Uses MariaDB because government_fms.sql was dumped from MariaDB 10.4.
#
#   docker compose up -d       # start (first run imports government_fms.sql)
#   docker compose down        # stop, keep data
#   docker compose down -v     # stop and wipe data (re-imports on next start)
#
# Host port defaults to 3307 so it doesn't clash with a local XAMPP/MySQL on 3306.
# Point the app at it with DATABASE_PORT=3307 in .env.

services:
  db:
    image: mariadb:10.11
    container_name: government_fms_db
    restart: unless-stopped
    environment:
      MARIADB_DATABASE: ${DATABASE_NAME:-government_fms}
      MARIADB_ROOT_PASSWORD: ${DATABASE_PASSWORD:-}
      MARIADB_ALLOW_EMPTY_ROOT_PASSWORD: ${DATABASE_ALLOW_EMPTY_PASSWORD:-yes}
      TZ: Asia/Manila
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_general_ci
    ports:
      - "${DATABASE_DOCKER_PORT:-3307}:3306"
    volumes:
      - db_data:/var/lib/mysql
      - ./government_fms.sql:/docker-entrypoint-initdb.d/01-government_fms.sql:ro
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  db_data:
